ight="700">▸  </tspan>11-variable Cox → 18-month</text><text x="1036" y="217" font-size="13.5" fill="#1f2933"><tspan fill="#6A1B9A" font-weight="700">     </tspan>event probability</text><text x="1036" y="244" font-size="13.5" fill="#1f2933"><tspan fill="#6A1B9A" font-weight="700">▸  </tspan>Quartile-based Cox risk tiers</text><text x="1036" y="271" font-size="13.5" fill="#1f2933"><tspan fill="#6A1B9A" font-weight="700">▸  </tspan>Integrated tier = max severity</text><text x="1036" y="290" font-size="13.5" fill="#1f2933"><tspan fill="#6A1B9A" font-weight="700">     </tspan>(Cox · Agent A · RA grade)</text><text x="1036" y="317" font-size="13.5" fill="#1f2933"><tspan fill="#6A1B9A" font-weight="700">▸  </tspan>8 rules → four-tier risk +</text><text x="1036" y="336" font-size="13.5" fill="#1f2933"><tspan fill="#6A1B9A" font-weight="700">     </tspan>recommended actions</text><line x1="178" y1="246.0" x2="229" y2="246.0" stroke="#5A6B7B" stroke-width="2.6" marker-end="url(#aG)"/><line x1="505" y1="246.0" x2="622" y2="246.0" stroke="#1F4E79" stroke-width="2.6" marker-end="url(#aA)"/><rect x="502.0" y="212.0" width="126.0" height="21" rx="6" fill="#ffffff" stroke="#1F4E79" stroke-width="1.2"/><text x="565.0" y="227.0" text-anchor="middle" font-size="12.5" font-style="italic" fill="#1F4E79">PatientSnapshot</text><line x1="898" y1="246.0" x2="1015" y2="246.0" stroke="#0E7C6B" stroke-width="2.6" marker-end="url(#aB)"/><rect x="895.0" y="212.0" width="126.0" height="21" rx="6" fill="#ffffff" stroke="#0E7C6B" stroke-width="1.2"/><text x="958.0" y="227.0" text-anchor="middle" font-size="12.5" font-style="italic" fill="#0E7C6B">RaImagingReport</text><g filter="url(#sh)"><rect x="625" y="430" width="666" height="152" rx="14" fill="#ffffff" stroke="#E8710A" stroke-width="2.4" stroke-dasharray="8 6"/></g><path d="M625,484 L625,444 Q625,430 639,430 L1277,430 Q1291,430 1291,444 L1291,484 Z" fill="#E8710A"/><text x="643" y="454" font-size="18" font-weight="700" fill="#ffffff">Optional LLM Reasoning Layer</text><text x="643" y="474" font-size="13" font-style="italic" fill="#eaf1f6">downstream of validated, deterministic outputs</text><text x="643" y="508" font-size="13.5" fill="#1f2933"><tspan fill="#E8710A" font-weight="700">▸  </tspan>5-section interpretation: mechanism · clinical priority · watchpoints · patient note · caveat</text><text x="643" y="535" font-size="13.5" fill="#1f2933"><tspan fill="#E8710A" font-weight="700">▸  </tspan>Independent safety-check call: contraindications, dosing &amp; guideline conflicts</text><text x="643" y="562" font-size="13.5" fill="#1f2933"><tspan fill="#E8710A" font-weight="700">▸  </tspan>Interpretive adjunct only — does not alter any quantitative output</text><line x1="1154.5" y1="372" x2="1154.5" y2="428" stroke="#E8710A" stroke-width="2.6" marker-end="url(#aO)"/><text x="1166.5" y="405.0" font-size="12" font-style="italic" fill="#E8710A">structured output</text><g filter="url(#sh)"><rect x="28" y="614" width="1263" height="86" rx="14" fill="#2E7D32"/></g><text x="52" y="648" font-size="18" font-weight="700" fill="#ffffff">Bilingual Streamlit web interface</text><text x="52" y="670" font-size="13" font-style="italic" fill="#e7f2e8">English / Simplified Chinese</text><text x="52" y="692" font-size="13" fill="#f2fbf3">Risk summary · RA strain panel · Cox gauge &amp; integrated tier · decision-rule cards · LLM reasoning + safety flags</text><line x1="745" y1="582" x2="720" y2="611" stroke="#2E7D32" stroke-width="2.4" marker-end="url(#aN)"/></svg>